<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 My Babyy ❤️</title>
    <!-- Thư viện Tailwind CSS và Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #030307;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            user-select: none;
            width: 100%;
            height: 100%;
        }

        /* Hiệu ứng nền bầu trời sao */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: 1;
        }

        /* Không gian 3D chuẩn */
        #universe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
            overflow: hidden;
            z-index: 2;
            display: none;
        }

        .galaxy-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Thẻ ảnh độc lập trong không gian 3D */
        .space-item-img {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            cursor: pointer;
            padding: 5px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 105, 180, 0.45);
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.35);
            transition: transform 0.3s ease;
        }

        .space-item-img img {
            width: 130px;
            height: 160px;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        .space-item-img:hover {
            transform: scale(1.2) translateZ(30px) !important;
            border-color: #ff4b6e;
            box-shadow: 0 8px 30px rgba(255, 75, 110, 0.6);
        }

        /* Thẻ chữ độc lập trong không gian 3D */
        .space-item-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            cursor: pointer;
            padding: 10px 20px;
            background: rgba(20, 20, 35, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 182, 193, 0.5);
            border-radius: 25px;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
            color: #ffb6c1;
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            white-space: nowrap;
            transition: transform 0.3s ease;
        }

        .space-item-text:hover {
            transform: scale(1.15) translateZ(30px) !important;
            color: #ffffff;
            border-color: #ff758c;
        }

        /* MÀN HÌNH INTRO */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: radial-gradient(circle at center, #2c162d 0%, #030307 100%);
            transition: opacity 1s ease;
        }

        .intro-text-a7 {
            font-family: 'Dancing Script', cursive;
            color: #ffb6c1;
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8), 0 0 25px rgba(255, 117, 140, 0.6);
            transition: opacity 0.5s ease, transform 0.5s ease;
            text-align: center;
            pointer-events: none;
        }

        .intro-card {
            position: relative;
            width: 350px;
            height: 480px;
            max-width: 88vw;
            max-height: 75vh;
            cursor: pointer;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(255, 105, 180, 0.5);
            border: 2px solid rgba(255, 182, 193, 0.6);
            overflow: visible;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .intro-card img.main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            transition: opacity 0.5s ease, transform 0.6s ease;
        }

        .overlay-photos {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-photo {
            position: absolute;
            width: 105px;
            height: 135px;
            object-fit: cover;
            border-radius: 12px;
            border: 2.5px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: scale(0.2) rotate(0deg);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 2 tấm ở HÀNG TRÊN */
        .mini-photo.show-1 {
            opacity: 1;
            transform: translate(-90px, -120px) scale(1) rotate(-10deg);
        }

        .mini-photo.show-2 {
            opacity: 1;
            transform: translate(90px, -120px) scale(1) rotate(10deg);
        }

        /* 3 tấm ở HÀNG DƯỚI */
        .mini-photo.show-3 {
            opacity: 1;
            transform: translate(-140px, 30px) scale(0.95) rotate(-15deg);
        }

        .mini-photo.show-4 {
            opacity: 1;
            transform: translate(0px, 50px) scale(1.05) rotate(0deg);
        }

        .mini-photo.show-5 {
            opacity: 1;
            transform: translate(140px, 30px) scale(0.95) rotate(15deg);
        }

        .fixed-title {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ff758c;
            font-family: 'Dancing Script', cursive;
            font-size: 2.3rem;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.8);
            pointer-events: none;
            display: none;
        }

        /* KHUNG PHÓNG TO ẢNH (MODAL LIGHTBOX) */
        #photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #photo-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        #modal-img {
            max-width: 85vw;
            max-height: 80vh;
            border-radius: 12px;
            border: 3px solid rgba(255, 182, 193, 0.8);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #photo-modal.active #modal-img {
            transform: scale(1);
        }
    </style>
</head>
<body>

    <!-- Nền sao lấp lánh -->
    <div class="stars" id="stars-container"></div>

    <!-- MÀN HÌNH INTRO -->
    <div id="welcome-screen">
        <h1 class="intro-text-a7" id="introText">Chúc mừng 20/10 My babyy ❤️</h1>

        <div class="intro-card" id="introCard" onclick="handleIntroClick()">
            <img src="A7.jpg" alt="A7 Intro" class="main-img" id="mainImg" onerror="this.src='A6.jpg'">
            
            <!-- 5 Ảnh PNG: 2 tấm ở trên (A10.1, A11.1) & 3 tấm ở dưới (A12.1, A13.1, A14.1) -->
            <div class="overlay-photos">
                <img src="A10.1.png" class="mini-photo" id="mini1">
                <img src="A11.1.png" class="mini-photo" id="mini2">
                <img src="A12.1.png" class="mini-photo" id="mini3">
                <img src="A13.1.png" class="mini-photo" id="mini4">
                <img src="A14.1.png" class="mini-photo" id="mini5">
            </div>
        </div>
    </div>

    <!-- Tiêu đề nổi -->
    <div class="fixed-title" id="fixedTitle">Hôm nay bạn là người xinhh nhất ❤️</div>

    <!-- KHÔNG GIAN 3D VŨ TRỤ -->
    <div id="universe">
        <div class="galaxy-inner" id="galaxy-inner"></div>
    </div>

    <!-- POPUP PHÓNG TO ẢNH -->
    <div id="photo-modal" onclick="closePhotoModal()">
        <img id="modal-img" src="" alt="Enlarged Photo">
    </div>

    <!-- Nhạc nền lãng mạn -->
    <audio id="bg-music" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/night_crickets.ogg" type="audio/ogg">
    </audio>

    <script>
        // Chỉ dùng danh sách file .jpg cho không gian 3D
        const photoList = [
            'A1.jpg', 'A2.jpg', 'A3.jpg', 'A4.jpg', 'A5.jpg', 'A6.jpg', 'A7.jpg',
            'A8.jpg', 'A9.jpg', 'A10.jpg', 'A11.jpg', 'A12.jpg', 'A13.jpg', 'A14.jpg', 'A15.jpg'
        ];

        const textList = [
            'Your Smile',
            'YaHiu in da hớt',
            'Fact: phụ nữ cũng có thể là thiếu nhi trong ngày 1/6 💖',
            'Chúc cục dàng dui dẻ ❤️',
            'Chan hết cái đề thi 📝✨',
            'Ăn ngon 🍲',
            'Anh Íu',
            'Thi tốt nhé cục dàng',
            'Phát tài, phát lộc',
            'Ngủ tốt✨',
            'Ngủ sớm 🌙'
        ];

        // Tạo nền sao lấp lánh ngẫu nhiên
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.backgroundColor = 'white';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.opacity = Math.random();
            star.style.borderRadius = '50%';
            star.style.boxShadow = `0 0 ${Math.random() * 6}px white`;
            starsContainer.appendChild(star);
        }

        let introStep = 0;

        function handleIntroClick() {
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Audio autoplay blocked"));

            const mainImg = document.getElementById('mainImg');
            const introText = document.getElementById('introText');
            const mini1 = document.getElementById('mini1');
            const mini2 = document.getElementById('mini2');
            const mini3 = document.getElementById('mini3');
            const mini4 = document.getElementById('mini4');
            const mini5 = document.getElementById('mini5');

            if (introStep === 0) {
                introText.style.opacity = '0';
                introText.style.transform = 'translateY(-20px)';
                
                mainImg.style.opacity = '0';
                setTimeout(() => {
                    introText.style.display = 'none';
                    mainImg.src = 'A6.jpg';
                    mainImg.style.opacity = '1';
                }, 250);
                introStep = 1;

            } else if (introStep === 1) {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                mini1.classList.add('show-1');
                mini2.classList.add('show-2');
                mini3.classList.add('show-3');
                mini4.classList.add('show-4');
                mini5.classList.add('show-5');

                introStep = 2;

                setTimeout(() => {
                    const welcomeScreen = document.getElementById('welcome-screen');
                    welcomeScreen.style.opacity = '0';

                    setTimeout(() => {
                        welcomeScreen.style.display = 'none';
                        document.getElementById('universe').style.display = 'block';
                        document.getElementById('fixedTitle').style.display = 'block';
                        
                        build3DGalaxy();
                        startInfiniteScroll3D();
                    }, 1000);
                }, 2200);
            }
        }

        function build3DGalaxy() {
            const galaxyInner = document.getElementById('galaxy-inner');
            const totalItems = 180;

            for (let i = 0; i < totalItems; i++) {
                const isImage = Math.random() < 0.7;
                const el = document.createElement('div');
                
                if (isImage) {
                    const imgSrc = photoList[Math.floor(Math.random() * photoList.length)];
                    el.className = 'space-item-img';
                    el.innerHTML = `<img src="${imgSrc}" alt="photo" onerror="this.src='A6.jpg'">`;
                    
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openPhotoModal(el.querySelector('img').src);
                    });
                } else {
                    const txt = textList[Math.floor(Math.random() * textList.length)];
                    el.className = 'space-item-text';
                    el.innerHTML = txt;
                }

                const x = (Math.random() * 1200 - 600);
                const y = (i * 45) - 3500;
                const z = (Math.random() * 1000 - 500);

                el.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                galaxyInner.appendChild(el);
            }
        }

        function openPhotoModal(src) {
            const modal = document.getElementById('photo-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = src;
            modal.classList.add('active');
        }

        function closePhotoModal() {
            const modal = document.getElementById('photo-modal');
            modal.classList.remove('active');
        }

        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let scrollYPos = -3500;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.3;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.3;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = (e.touches[0].clientX - window.innerWidth / 2) * 0.4;
                mouseY = (e.touches[0].clientY - window.innerHeight / 2) * 0.4;
            }
        });

        function startInfiniteScroll3D() {
            function animate() {
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;

                scrollYPos += 1.2;
                if (scrollYPos > 3500) {
                    scrollYPos = -3500;
                }

                const galaxyInner = document.getElementById('galaxy-inner');
                galaxyInner.style.transform = `rotateX(${-targetY}deg) rotateY(${targetX}deg) translateY(${scrollYPos}px)`;

                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
